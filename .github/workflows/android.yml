name: Android

on:
  push:
    branches: ["main", "chatgpt/android-port"]
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests, release lint, debug APK, and release AAB
        run: gradle -p Android :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-rush-android-lint
          path: |
            Android/app/build/reports/lint-results-release.html
            Android/app/build/reports/lint-results-release.txt
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: gold-rush-android-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: gold-rush-android-release-aab
          path: Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
