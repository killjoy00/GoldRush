name: Android crash vitals probe

on:
  push:
    branches: [android-crash-vitals-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Play Developer Reporting API
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/playdeveloperreporting
          create_credentials_file: false
      - name: Query all Android vitals errors
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://playdeveloperreporting.googleapis.com/v1beta1/apps/com.killjoy00.goldrush"
          echo "PLAY_VITALS_ALL_BEGIN"
          for kind in CRASH ANR; do
            out="/tmp/${kind}.json"
            http="$(curl -sS -G -o "${out}" -w '%{http_code}'               -H "Authorization: Bearer ${ACCESS_TOKEN}"               -H "Accept: application/json"               --data-urlencode "filter=errorIssueType = ${kind}"               --data-urlencode "orderBy=errorReportCount desc"               --data-urlencode "sampleErrorReportLimit=1"               --data-urlencode "pageSize=100"               "${base}/errorIssues:search")"
            echo "${kind}Http=${http}"
            if [ "${http}" = "200" ]; then
              echo "${kind}IssueCount=$(jq '(.errorIssues // []) | length' "${out}")"
              jq '{errorIssues:[.errorIssues[]? | {name,type,cause,location,errorReportCount,distinctUsers,firstOsVersion,lastOsVersion,firstAppVersion,lastAppVersion,sampleErrorReports}]}' "${out}"
            else
              cat "${out}"
            fi
          done
          echo "PLAY_VITALS_ALL_END"
