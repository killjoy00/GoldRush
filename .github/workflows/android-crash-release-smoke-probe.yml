name: Android release crash smoke probe

on:
  push:
    branches: [android-crash-vitals-probe]

permissions:
  contents: read

jobs:
  smoke-release:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Minified release launch/background/rotate smoke
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            set -euo pipefail
            gradle -p Android :app:assembleRelease --no-daemon --stacktrace
            unsigned="$(find Android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' -o -name 'app-release.apk' | head -n 1)"
            test -n "$unsigned"
            keystore="$RUNNER_TEMP/goldrush-upload.jks"
            signed="$RUNNER_TEMP/goldrush-release-signed.apk"
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            test -s "$keystore"
            apksigner sign               --ks "$keystore"               --ks-pass "pass:$ANDROID_UPLOAD_KEYSTORE_PASSWORD"               --ks-key-alias "$ANDROID_UPLOAD_KEY_ALIAS"               --key-pass "pass:$ANDROID_UPLOAD_KEY_PASSWORD"               --out "$signed"               "$unsigned"
            apksigner verify "$signed"

            adb install -r "$signed"
            adb logcat -c
            adb shell am start -W -n com.killjoy00.goldrush/.MainActivity
            sleep 5
            adb shell pidof com.killjoy00.goldrush >/dev/null
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell am start -W -n com.killjoy00.goldrush/.MainActivity
            sleep 3
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 1 || true
            sleep 3
            adb shell pidof com.killjoy00.goldrush >/dev/null

            adb logcat -d > /tmp/logcat.txt
            if grep -E -A25 -B5 'FATAL EXCEPTION|Process: com\.killjoy00\.goldrush' /tmp/logcat.txt; then
              echo "::error::Fatal exception detected for minified Gold Rush release"
              exit 1
            fi
            echo "ANDROID_RELEASE_SMOKE_OK api=${{ matrix.api }}"
