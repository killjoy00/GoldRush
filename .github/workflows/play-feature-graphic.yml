name: Generate Play feature graphic

on:
  push:
    branches: ["android-feature-graphic"]
    paths:
      - "Tools/make_play_feature_graphic.py"
      - ".github/workflows/play-feature-graphic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate 1024x500 RGB feature graphic
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 Tools/make_play_feature_graphic.py generated/play-store/feature-graphic.png

      - uses: actions/upload-artifact@v4
        with:
          name: gold-rush-play-feature-graphic
          path: generated/play-store/feature-graphic.png
          if-no-files-found: error
          retention-days: 14
