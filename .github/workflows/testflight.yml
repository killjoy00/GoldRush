name: TestFlight

# Manual, or on a v* tag. Never on an ordinary push: every upload consumes a
# TestFlight build number and notifies testers.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What testers should know about this build"
        required: false
        default: "Automated build"
  push:
    tags: ["v*"]

jobs:
  upload:
    name: Archive, sign and upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Change this by setting a repository variable of the same name.
      BUNDLE_ID: ${{ vars.GOLDRUSH_BUNDLE_ID || 'com.killjoy00.goldrush' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Check required secrets are present
        # Fails with a readable message rather than a confusing signing error
        # forty lines into an xcodebuild log.
        run: |
          missing=""
          [ -z "${{ secrets.ASC_KEY_ID }}" ] && missing="$missing ASC_KEY_ID"
          [ -z "${{ secrets.ASC_ISSUER_ID }}" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "${{ secrets.ASC_KEY_P8 }}" ] && missing="$missing ASC_KEY_P8"
          [ -z "${{ secrets.APPLE_TEAM_ID }}" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "See docs/DEPLOYMENT.md for how to create each one."
            exit 1
          fi
          echo "All four secrets present."

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -uo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          RAW="$RUNNER_TEMP/asc_key_raw"

          printf '%s' "$ASC_KEY_P8" > "$RAW"

          # Normalise two things a copy-paste commonly does to a PEM file:
          # Windows line endings, and newlines flattened into the literal two
          # characters backslash-n.
          tr -d '\r' < "$RAW" > "$RAW.n" && mv "$RAW.n" "$RAW"
          if grep -q 'BEGIN PRIVATE KEY' "$RAW" && ! grep -q '^-----END PRIVATE KEY-----' "$RAW"; then
            echo "note: expanding literal \\n sequences into real newlines"
            perl -pe 's/\\n/\n/g' "$RAW" > "$RAW.n" && mv "$RAW.n" "$RAW"
          fi

          if grep -q 'BEGIN PRIVATE KEY' "$RAW"; then
            echo "ASC_KEY_P8 looks like PEM text; using it as-is."
            cp "$RAW" "$KEY_PATH"
          else
            echo "ASC_KEY_P8 is not PEM text; trying to base64-decode it."
            # macOS ships BSD base64, which spells decode as -D. GNU coreutils
            # spells it -d/--decode. Try each rather than assuming the runner's
            # flavour.
            tr -d '[:space:]' < "$RAW" > "$RAW.compact"
            DECODED="$RUNNER_TEMP/asc_key_decoded"
            if   base64 -D       < "$RAW.compact" > "$DECODED" 2>/dev/null && [ -s "$DECODED" ]; then
              echo "decoded with: base64 -D (BSD)"
            elif base64 -d       < "$RAW.compact" > "$DECODED" 2>/dev/null && [ -s "$DECODED" ]; then
              echo "decoded with: base64 -d"
            elif base64 --decode < "$RAW.compact" > "$DECODED" 2>/dev/null && [ -s "$DECODED" ]; then
              echo "decoded with: base64 --decode (GNU)"
            else
              : > "$DECODED"
            fi

            if grep -q 'BEGIN PRIVATE KEY' "$DECODED" 2>/dev/null; then
              # The secret was base64 of the whole .p8 file.
              echo "decoded to a full PEM file."
              cp "$DECODED" "$KEY_PATH"
            elif [ "$(head -c1 "$DECODED" 2>/dev/null | od -An -tx1 | tr -d ' \n')" = "30" ]; then
              # The secret was the PEM *body* with its -----BEGIN/END----- lines
              # stripped off -- so it decodes to raw PKCS#8 DER, which always
              # starts with the ASN.1 SEQUENCE tag 0x30. Easy to produce by
              # copying only the middle of the file, and trivially recoverable:
              # put the wrapper back.
              echo "decoded to raw DER (PEM header lines were missing); re-wrapping."
              {
                echo "-----BEGIN PRIVATE KEY-----"
                fold -w 64 "$RAW.compact"
                echo ""
                echo "-----END PRIVATE KEY-----"
              } > "$KEY_PATH"
              # fold may or may not end with a newline; collapse any blank line.
              grep -v '^$' "$KEY_PATH" > "$KEY_PATH.n" && mv "$KEY_PATH.n" "$KEY_PATH"
            else
              : > "$KEY_PATH"
            fi
            rm -f "$DECODED"
          fi

          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH" 2>/dev/null; then
            # Report the shape of the secret without ever echoing its contents,
            # so a failure here is diagnosable from the log alone.
            LEN=$(wc -c < "$RAW" | tr -d ' ')
            HAS_DASH=$(grep -qc '^-----' "$RAW" 2>/dev/null && echo yes || echo no)
            IS_B64=$(grep -Eq '^[A-Za-z0-9+/=[:space:]]+$' "$RAW" && echo yes || echo no)
            echo "::error::ASC_KEY_P8 is neither a PEM private key nor valid base64 of one."
            echo "::error::Secret is ${LEN} characters. Begins with dashes: ${HAS_DASH}. Base64 charset only: ${IS_B64}."
            echo "::error::Expected either the full text of AuthKey_XXXXXXXX.p8 (including the"
            echo "::error::-----BEGIN PRIVATE KEY----- and -----END PRIVATE KEY----- lines), or its base64."
            echo "::error::A ~250 character secret with dashes=no is usually the Key ID or Issuer ID"
            echo "::error::pasted into the wrong secret."
            rm -f "$RAW" "$RAW.compact"
            exit 1
          fi

          chmod 600 "$KEY_PATH"
          rm -f "$RAW" "$RAW.compact"

          # Prove the key actually parses as a private key, rather than just
          # looking like one. A malformed key would otherwise surface much later
          # as an opaque authentication failure inside xcodebuild.
          if command -v openssl >/dev/null 2>&1; then
            if openssl pkey -in "$KEY_PATH" -noout 2>/dev/null; then
              echo "openssl parsed the key successfully."
            else
              echo "::error::The key was assembled but openssl cannot parse it as a private key."
              echo "::error::Re-copy AuthKey_${ASC_KEY_ID}.p8 in full, including its BEGIN and END lines."
              exit 1
            fi
          fi

          echo "API key installed at AuthKey_${ASC_KEY_ID}.p8 ($(wc -c < "$KEY_PATH" | tr -d ' ') bytes)."

      - name: Preflight App Store Connect
        # xcodebuild reports every signing problem as "Cloud signing permission
        # error" / "No profiles were found", which covers at least four
        # unrelated causes with different fixes. This asks Apple directly and
        # names the actual one, before spending a full signed build to find out.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 Tools/asc_preflight.py

      - name: Archive
        # Cloud signing: -allowProvisioningUpdates with an App Store Connect API
        # key lets Xcode create the bundle ID, certificate and provisioning
        # profile on demand. That is why this pipeline never asks anyone to
        # export a .p12 or touch a Keychain.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd App
          xcodebuild archive \
            -project GoldRush.xcodeproj \
            -scheme GoldRush \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GoldRush.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipMacroValidation \
            GOLDRUSH_BUNDLE_ID="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Write export options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST

      - name: Export the .ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GoldRush.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "Uploading $IPA (build ${{ github.run_number }})"
          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldrush-build-${{ github.run_number }}
          # The .xcarchive is kept as well as the .ipa. Archiving is the slow,
          # credential-dependent half of this job, and when export fails after a
          # successful archive there is no reason to discard the build that
          # already worked.
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/GoldRush.xcarchive
          if-no-files-found: ignore
          retention-days: 14
