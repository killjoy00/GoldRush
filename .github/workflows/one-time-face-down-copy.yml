name: One-time Android face-down copy cleanup

on:
  push:
    branches: ["chatgpt/android-release-hardening-2"]
    paths:
      - ".github/workflows/one-time-face-down-copy.yml"

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/android-release-hardening-2

      - name: Standardize player-facing terminology
        shell: python
        run: |
          from pathlib import Path

          path = Path("Android/app/src/main/java/com/killjoy00/goldrush/ui/GoldRushApp.kt")
          text = path.read_text()
          replacements = {
              "Choose a pile without seeing the buried cards.": "Choose a pile without seeing the face-down cards.",
              "Legal split · ${faceDown.size}/$hiddenNeeded buried": "Legal split · ${faceDown.size}/$hiddenNeeded face down",
              "Need two non-empty piles and exactly $hiddenNeeded buried.": "Need two non-empty piles and exactly $hiddenNeeded face down.",
              "A chooser learns buried cards only in the pile they take.": "A chooser learns face-down cards only in the pile they take.",
              "Together: round 4 gives each player 9 cards and 2 buried. Take Turns: rounds 7 and 8 draw 9 with 2 buried.": "Together: round 4 gives each player 9 cards and 2 face down. Take Turns: rounds 7 and 8 draw 9 with 2 face down.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected copy not found: {old}")
              text = text.replace(old, new)
          path.write_text(text)

      - name: Commit copy cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Android/app/src/main/java/com/killjoy00/goldrush/ui/GoldRushApp.kt
          git commit -m "Standardize Android face-down terminology"
          git push origin HEAD:chatgpt/android-release-hardening-2
