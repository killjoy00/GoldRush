name: AdMob verification diagnostic

on:
  push:
    branches: ["chatgpt/admob-verification-fix"]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_ID: ${{ vars.GOLDRUSH_BUNDLE_ID || 'com.killjoy00.goldrush' }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe live app-ads.txt delivery
        run: |
          set -euo pipefail
          expected='google.com, pub-1217971050094766, DIRECT, f08c47fec0942fa0'
          for url in \
            'http://killjoy00.github.io/app-ads.txt' \
            'https://killjoy00.github.io/app-ads.txt'
          do
            echo "=== $url ==="
            rm -f /tmp/headers /tmp/body
            curl -sS -L --max-redirs 1 -D /tmp/headers -o /tmp/body "$url"
            cat /tmp/headers
            printf 'BODY: '
            cat /tmp/body
            echo
            if [ "$(cat /tmp/body)" != "$expected" ]; then
              echo "::error::Unexpected app-ads.txt body from $url"
              exit 1
            fi
          done

          echo '=== HTTPS as Googlebot ==='
          rm -f /tmp/headers /tmp/body
          curl -sS -L --max-redirs 1 \
            -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' \
            -D /tmp/headers -o /tmp/body \
            'https://killjoy00.github.io/app-ads.txt'
          cat /tmp/headers
          printf 'BODY: '
          cat /tmp/body
          echo
          if [ "$(cat /tmp/body)" != "$expected" ]; then
            echo '::error::Unexpected app-ads.txt body for Googlebot user agent'
            exit 1
          fi

          echo '=== robots.txt ==='
          curl -sS -L --max-redirs 1 -D - -o /tmp/robots \
            'https://killjoy00.github.io/robots.txt' || true
          printf 'BODY: '
          cat /tmp/robots 2>/dev/null || true
          echo

      - name: Check App Store Connect secrets
        run: |
          missing=""
          [ -z "${{ secrets.ASC_KEY_ID }}" ] && missing="$missing ASC_KEY_ID"
          [ -z "${{ secrets.ASC_ISSUER_ID }}" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "${{ secrets.ASC_KEY_P8 }}" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: Tools/install_asc_key.sh

      - name: Diagnose public and App Store Connect metadata
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 Tools/admob_diagnostic.py
