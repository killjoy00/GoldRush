name: Pack One Play API probe

on:
  push:
    branches:
      - "chatgpt/packone-play-probe"
    paths:
      - ".github/workflows/packone-play-api-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Play Developer API
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Probe Pack One and shared monetization readiness
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Accept: application/json")
          pack="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/pro.packone.app"
          gold="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.killjoy00.goldrush"
          edit_id=""

          cleanup() {
            if [ -n "$edit_id" ]; then
              curl -sS -X DELETE "${pack}/edits/${edit_id}" "${auth[@]}" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo "PACKONE_PLAY_PROBE_BEGIN"

          # Live proof that the existing service account + Android Publisher API still work.
          gold_code="$(curl -sS -o "$RUNNER_TEMP/gold-product.json" -w '%{http_code}' "${gold}/oneTimeProducts/com.killjoy00.goldrush.removeads" "${auth[@]}")"
          echo "shared_api_http=${gold_code}"
          if [ "$gold_code" = "200" ]; then
            echo "shared_api_status=ok"
            echo "goldrush_product_state=$(jq -r '[.purchaseOptions[]? | select(.purchaseOptionId == "buy")][0].state // "unknown"' "$RUNNER_TEMP/gold-product.json")"
            echo "goldrush_us_price_units=$(jq -r '[.purchaseOptions[]? | select(.purchaseOptionId == "buy")][0].regionalPricingAndAvailabilityConfigs[]? | select(.regionCode == "US") | .price.units][0] // "unknown"' "$RUNNER_TEMP/gold-product.json")"
          else
            echo "shared_api_status=failed"
            jq -r '"shared_api_error_status=" + (.error.status // "unknown"), "shared_api_error_message=" + (.error.message // "unknown")' "$RUNNER_TEMP/gold-product.json" 2>/dev/null || true
          fi

          # Read-only Pack One existence/access probe: create a disposable edit, inspect, then delete it.
          pack_code="$(curl -sS -o "$RUNNER_TEMP/pack-edit.json" -w '%{http_code}' -X POST "${pack}/edits" "${auth[@]}" -H "Content-Type: application/json" -d '{}')"
          echo "packone_edit_http=${pack_code}"

          if [ "$pack_code" = "200" ]; then
            edit_id="$(jq -r '.id' "$RUNNER_TEMP/pack-edit.json")"
            echo "packone_app_access=ok"

            tracks_code="$(curl -sS -o "$RUNNER_TEMP/pack-tracks.json" -w '%{http_code}' "${pack}/edits/${edit_id}/tracks" "${auth[@]}")"
            bundles_code="$(curl -sS -o "$RUNNER_TEMP/pack-bundles.json" -w '%{http_code}' "${pack}/edits/${edit_id}/bundles" "${auth[@]}")"
            listings_code="$(curl -sS -o "$RUNNER_TEMP/pack-listings.json" -w '%{http_code}' "${pack}/edits/${edit_id}/listings" "${auth[@]}")"

            echo "packone_tracks_http=${tracks_code}"
            echo "packone_track_names=$(jq -r '[.tracks[]?.track] | join(",")' "$RUNNER_TEMP/pack-tracks.json" 2>/dev/null || echo unknown)"
            echo "packone_bundles_http=${bundles_code}"
            echo "packone_bundle_count=$(jq -r '(.bundles // []) | length' "$RUNNER_TEMP/pack-bundles.json" 2>/dev/null || echo unknown)"
            echo "packone_listings_http=${listings_code}"
            echo "packone_listing_count=$(jq -r '(.listings // []) | length' "$RUNNER_TEMP/pack-listings.json" 2>/dev/null || echo unknown)"
          else
            echo "packone_app_access=unavailable"
            jq -r '"packone_error_code=" + ((.error.code // 0)|tostring), "packone_error_status=" + (.error.status // "unknown"), "packone_error_message=" + (.error.message // "unknown")' "$RUNNER_TEMP/pack-edit.json" 2>/dev/null || true
          fi

          echo "PACKONE_PLAY_PROBE_END"
