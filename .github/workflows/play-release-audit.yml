name: Google Play release audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Play Developer API
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Audit live Play state
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: com.killjoy00.goldrush
          PRODUCT_ID: com.killjoy00.goldrush.removeads
          CLOSED_TRACK: production-access
          EXPECTED_CONTACT_WEBSITE: https://killjoy00.github.io/
          EXPECTED_CONTACT_EMAIL: killjoy00@yahoo.com
        shell: bash
        run: |
          set -euo pipefail
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}"
          work="$(mktemp -d)"
          edit_id=""

          cleanup() {
            if [ -n "$edit_id" ]; then
              curl -sS -X DELETE \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "${base}/edits/${edit_id}" >/dev/null || true
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT

          api_get() {
            curl --fail-with-body -sS \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Accept: application/json" \
              "$1"
          }

          http_get() {
            output="$1"
            url="$2"
            curl -sS -o "$output" -w '%{http_code}' \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Accept: application/json" \
              "$url"
          }

          expected_version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' Android/app/build.gradle.kts | head -n 1)"
          test -n "$expected_version_code"
          expected_title="$(tr -d '\r\n' < docs/play-store/title.txt)"
          expected_short="$(tr -d '\r\n' < docs/play-store/short-description.txt)"
          expected_full="$(cat docs/play-store/full-description.txt)"

          # Monetization: permanent Remove Ads product.
          api_get "${base}/oneTimeProducts/${PRODUCT_ID}" > "$work/product.json"
          product_state="$(jq -r '[.purchaseOptions[] | select(.purchaseOptionId == "buy")][0].state // empty' "$work/product.json")"
          us_price="$(jq -r '[.purchaseOptions[] | select(.purchaseOptionId == "buy")][0].regionalPricingAndAvailabilityConfigs[] | select(.regionCode == "US") | .price | ((.units // "0") + "." + (((.nanos // 0) / 10000000 | floor) | tostring | if length == 1 then "0" + . else . end))' "$work/product.json")"
          product_region_count="$(jq '[.purchaseOptions[] | select(.purchaseOptionId == "buy")][0].regionalPricingAndAvailabilityConfigs // [] | map(select(.availability == "AVAILABLE")) | length' "$work/product.json")"
          test "$product_state" = "ACTIVE"
          test "$us_price" = "2.99"

          # Create a read-only edit snapshot for release/listing/distribution resources.
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${base}/edits" > "$work/edit.json"
          edit_id="$(jq -r '.id' "$work/edit.json")"
          test -n "$edit_id" && test "$edit_id" != "null"

          api_get "${base}/edits/${edit_id}/tracks" > "$work/tracks.json"
          api_get "${base}/edits/${edit_id}/tracks/internal" > "$work/internal.json"

          closed_http="$(http_get "$work/closed.json" "${base}/edits/${edit_id}/tracks/${CLOSED_TRACK}")"
          if [ "$closed_http" != "200" ]; then
            echo "::error::Closed-testing track ${CLOSED_TRACK} is not readable (HTTP ${closed_http})."
            cat "$work/closed.json" || true
            exit 1
          fi

          production_http="$(http_get "$work/production.json" "${base}/edits/${edit_id}/tracks/production")"
          if [ "$production_http" != "200" ]; then
            echo '{}' > "$work/production.json"
          fi

          internal_completed="$(jq -r --arg vc "$expected_version_code" '[.releases[]? | select(.status == "completed") | .versionCodes[]? | select(. == $vc)] | length' "$work/internal.json")"
          test "$internal_completed" -ge 1
          internal_release_count="$(jq '(.releases // []) | length' "$work/internal.json")"

          closed_release_count="$(jq '(.releases // []) | length' "$work/closed.json")"
          closed_expected_completed="$(jq -r --arg vc "$expected_version_code" '[.releases[]? | select(.status == "completed") | .versionCodes[]? | select(. == $vc)] | length' "$work/closed.json")"
          if [ "$closed_expected_completed" -lt 1 ]; then
            echo "::error::Expected versionCode ${expected_version_code} is not completed on closed-testing track ${CLOSED_TRACK}."
            exit 1
          fi

          production_release_count="$(jq '(.releases // []) | length' "$work/production.json")"
          production_completed_count="$(jq '[.releases[]? | select(.status == "completed")] | length' "$work/production.json")"
          track_names="$(jq -r '[.tracks[]?.track] | join(",")' "$work/tracks.json")"

          api_get "${base}/edits/${edit_id}/bundles" > "$work/bundles.json"
          bundle_version_present="$(jq -r --argjson vc "$expected_version_code" '[.bundles[]? | select(.versionCode == $vc)] | length' "$work/bundles.json")"
          test "$bundle_version_present" -ge 1
          bundle_count="$(jq '(.bundles // []) | length' "$work/bundles.json")"

          # Store listing and developer contact data.
          api_get "${base}/edits/${edit_id}/listings" > "$work/listings.json"
          api_get "${base}/edits/${edit_id}/listings/en-US" > "$work/listing.json"
          api_get "${base}/edits/${edit_id}/details" > "$work/details.json"
          listing_locale_count="$(jq '(.listings // []) | length' "$work/listings.json")"

          live_title="$(jq -r '.title // ""' "$work/listing.json")"
          live_short="$(jq -r '.shortDescription // ""' "$work/listing.json")"
          live_full="$(jq -r '.fullDescription // ""' "$work/listing.json")"
          test "$live_title" = "$expected_title"
          test "$live_short" = "$expected_short"
          test "$live_full" = "$expected_full"

          default_language="$(jq -r '.defaultLanguage // ""' "$work/details.json")"
          contact_website="$(jq -r '.contactWebsite // ""' "$work/details.json")"
          contact_email="$(jq -r '.contactEmail // ""' "$work/details.json")"
          test "$default_language" = "en-US"
          test "$contact_website" = "$EXPECTED_CONTACT_WEBSITE"
          test "$contact_email" = "$EXPECTED_CONTACT_EMAIL"

          count_images() {
            image_type="$1"
            api_get "${base}/edits/${edit_id}/listings/en-US/${image_type}" > "$work/${image_type}.json"
            jq '(.images // []) | length' "$work/${image_type}.json"
          }
          icon_count="$(count_images icon)"
          feature_count="$(count_images featureGraphic)"
          phone_count="$(count_images phoneScreenshots)"
          seven_count="$(count_images sevenInchScreenshots)"
          ten_count="$(count_images tenInchScreenshots)"
          test "$icon_count" -eq 1
          test "$feature_count" -eq 1
          test "$phone_count" -ge 4

          # Tester API can expose Google Groups only; Play Console email lists and actual opt-in count are not exposed here.
          testers_http="$(http_get "$work/testers.json" "${base}/edits/${edit_id}/testers/internal")"
          if [ "$testers_http" = "200" ]; then
            tester_google_group_count="$(jq '(.googleGroups // []) | length' "$work/testers.json")"
          else
            tester_google_group_count="unavailable-http-${testers_http}"
          fi

          # Per-track country availability. Production is a hard US + Canada-only launch.
          internal_country_http="$(http_get "$work/internal-countries.json" "${base}/edits/${edit_id}/countryAvailability/internal")"
          if [ "$internal_country_http" = "200" ]; then
            internal_country_count="$(jq '(.countries // []) | length' "$work/internal-countries.json")"
            internal_rest_of_world="$(jq -r '.restOfWorld // false' "$work/internal-countries.json")"
            internal_sync_production="$(jq -r '.syncWithProduction // false' "$work/internal-countries.json")"
          else
            internal_country_count="unavailable-http-${internal_country_http}"
            internal_rest_of_world="unknown"
            internal_sync_production="unknown"
          fi

          production_country_http="$(http_get "$work/production-countries.json" "${base}/edits/${edit_id}/countryAvailability/production")"
          if [ "$production_country_http" = "200" ]; then
            production_country_count="$(jq '(.countries // []) | length' "$work/production-countries.json")"
            production_country_codes="$(jq -r '[.countries[]?.countryCode] | unique | sort | join(",")' "$work/production-countries.json")"
            production_rest_of_world="$(jq -r '.restOfWorld // false' "$work/production-countries.json")"
            if [ "$production_country_codes" != "CA,US" ] || [ "$production_rest_of_world" != "false" ]; then
              echo "::error::Production availability must be exactly Canada + United States. Current countries=${production_country_codes:-none}, restOfWorld=${production_rest_of_world}."
              exit 1
            fi
            production_country_guard="pass"
          else
            production_country_count="unavailable-http-${production_country_http}"
            production_country_codes="unavailable"
            production_rest_of_world="unknown"
            production_country_guard="locked-or-unavailable"
          fi

          echo "GOOGLE_PLAY_AUDIT_BEGIN"
          echo "expectedVersionCode=${expected_version_code}"
          echo "bundleCount=${bundle_count}"
          echo "bundleExpectedVersionPresent=${bundle_version_present}"
          echo "trackNames=${track_names}"
          echo "internalReleaseCount=${internal_release_count}"
          echo "internalExpectedVersionCompleted=${internal_completed}"
          echo "closedTrack=${CLOSED_TRACK}"
          echo "closedTrackHttp=${closed_http}"
          echo "closedReleaseCount=${closed_release_count}"
          echo "closedExpectedVersionCompleted=${closed_expected_completed}"
          echo "productionTrackHttp=${production_http}"
          echo "productionReleaseCount=${production_release_count}"
          echo "productionCompletedReleaseCount=${production_completed_count}"
          echo "listingLocaleCount=${listing_locale_count}"
          echo "defaultLanguage=${default_language}"
          echo "contactWebsiteConfigured=true"
          echo "contactEmailConfigured=true"
          echo "icon=${icon_count}"
          echo "featureGraphic=${feature_count}"
          echo "phoneScreenshots=${phone_count}"
          echo "sevenInchScreenshots=${seven_count}"
          echo "tenInchScreenshots=${ten_count}"
          echo "removeAdsState=${product_state}"
          echo "removeAdsUsPrice=${us_price}"
          echo "removeAdsAvailableRegionCount=${product_region_count}"
          echo "internalTesterGoogleGroupCount=${tester_google_group_count}"
          echo "internalCountryCount=${internal_country_count}"
          echo "internalRestOfWorld=${internal_rest_of_world}"
          echo "internalSyncWithProduction=${internal_sync_production}"
          echo "productionCountryCount=${production_country_count}"
          echo "productionCountryCodes=${production_country_codes}"
          echo "productionRestOfWorld=${production_rest_of_world}"
          echo "productionCountryGuard=${production_country_guard}"
          echo "GOOGLE_PLAY_AUDIT_END"
