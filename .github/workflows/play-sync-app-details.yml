name: Sync Play app details

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Play Developer API
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Configure and verify app details
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: com.killjoy00.goldrush
          CONTACT_EMAIL: killjoy00@yahoo.com
          CONTACT_WEBSITE: https://killjoy00.github.io/
        shell: bash
        run: |
          set -euo pipefail
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}"
          work="$(mktemp -d)"
          edit_id=""

          cleanup() {
            if [ -n "$edit_id" ]; then
              curl -sS -X DELETE \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "${base}/edits/${edit_id}" >/dev/null || true
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT

          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${base}/edits" > "$work/edit.json"
          edit_id="$(jq -r '.id' "$work/edit.json")"
          test -n "$edit_id" && test "$edit_id" != "null"

          jq -n \
            --arg language "en-US" \
            --arg website "$CONTACT_WEBSITE" \
            --arg email "$CONTACT_EMAIL" \
            '{defaultLanguage:$language,contactWebsite:$website,contactEmail:$email}' \
            > "$work/details.json"

          curl --fail-with-body -sS \
            -X PATCH \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @"$work/details.json" \
            "${base}/edits/${edit_id}/details" > "$work/updated.json"

          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${base}/edits/${edit_id}:validate" > "$work/validated.json"

          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${base}/edits/${edit_id}:commit" > "$work/committed.json"
          edit_id=""

          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${base}/edits" > "$work/verify-edit.json"
          edit_id="$(jq -r '.id' "$work/verify-edit.json")"

          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${base}/edits/${edit_id}/details" > "$work/final.json"

          test "$(jq -r '.defaultLanguage // ""' "$work/final.json")" = "en-US"
          test "$(jq -r '.contactWebsite // ""' "$work/final.json")" = "$CONTACT_WEBSITE"
          test "$(jq -r '.contactEmail // ""' "$work/final.json")" = "$CONTACT_EMAIL"

          echo "Play app details configured successfully."
          echo "Default language: en-US"
          echo "Contact website configured: true"
          echo "Contact email configured: true"
