name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine + Sim (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
      - name: Release build (the simulator runs at -O)
        run: swift build -c release

  ios:
    name: iOS UI typecheck
    # Pinned from the probe run: macos-26 carries Xcode 26.6 (17F113), the
    # iOS 26.5 SDK and Swift 6.3.3 -- the same compiler the engine is tested
    # with on Linux, so there is no version skew between the two halves.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version
      - name: Build engine for iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme GoldRushEngine \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/engine-ios.log" 2>&1 || { echo "=== errors ==="; grep -E "error:" "$RUNNER_TEMP/engine-ios.log" | sort -u | head -40; exit 1; }
      - name: Typecheck the SwiftUI screens against the iOS SDK
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme GoldRushUI \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/ui-ios.log" 2>&1 || { echo "=== errors ==="; grep -E "error:" "$RUNNER_TEMP/ui-ios.log" | sort -u | head -40; exit 1; }

  app:
    name: iOS app build (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Build the app target without signing
        # Validates the hand-written project file end to end. Nobody on this
        # project has a Mac to open it in, so this job is the only thing that
        # proves GoldRush.xcodeproj is well-formed -- and it needs no Apple
        # credentials, so it runs on every push, not just release builds.
        run: |
          set -o pipefail
          cd App
          xcodebuild build \
            -project GoldRush.xcodeproj \
            -scheme GoldRush \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            GOLDRUSH_BUNDLE_ID=com.goldrush.ci \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" > "$RUNNER_TEMP/app-build.log" 2>&1 || { echo "=== errors ==="; grep -E "error:" "$RUNNER_TEMP/app-build.log" | sort -u | head -40; exit 1; }

      - name: Archive the app without signing
        # `build` is not a strong enough check on this project file. A malformed
        # package-product reference once passed `build` and then failed `archive`
        # with "the project is damaged" -- archive walks the target graph
        # differently and rejects wiring that build tolerates.
        #
        # Archiving unsigned needs no Apple credentials, so the release path gets
        # exercised on every push rather than only when someone tries to ship.
        run: |
          set -o pipefail
          cd App
          xcodebuild archive \
            -project GoldRush.xcodeproj \
            -scheme GoldRush \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CIGoldRush.xcarchive" \
            -skipMacroValidation \
            GOLDRUSH_BUNDLE_ID=com.goldrush.ci \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" > "$RUNNER_TEMP/app-archive.log" 2>&1 || { echo "=== errors ==="; grep -E "error:" "$RUNNER_TEMP/app-archive.log" | sort -u | head -40; exit 1; }
          test -d "$RUNNER_TEMP/CIGoldRush.xcarchive" \
            || { echo "::error::archive produced no .xcarchive"; exit 1; }
          echo "Archive created and readable."

  ipad-compat-screenshot:
    name: iPad compatibility-mode screenshot
    # Nobody on this project has a Mac or an iPad, so this is the only way
    # to actually SEE the rendering App Review saw: build for the Simulator,
    # boot the same device/OS the rejection named, launch, and screenshot.
    # An iPhone-only app (TARGETED_DEVICE_FAMILY=1) runs on iPad in a small
    # iPhone-shaped "compatibility mode" window rather than a real iPad
    # layout, and there is no way to opt an iPhone-only app out of that --
    # so this job renders the same window App Review does, on every push,
    # rather than trusting the layout math to be right.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          cd App
          xcodebuild build \
            -project GoldRush.xcodeproj \
            -scheme GoldRush \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipMacroValidation \
            GOLDRUSH_BUNDLE_ID=com.goldrush.ci \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/sim-build.log" 2>&1 || { echo "=== errors ==="; grep -E "error:" "$RUNNER_TEMP/sim-build.log" | sort -u | head -40; exit 1; }

      - name: Boot the review device and screenshot the home screen
        run: |
          set -o pipefail
          echo "=== Available iPad device types ==="
          xcrun simctl list devicetypes | grep -i ipad || true
          echo "=== Available iOS/iPadOS runtimes ==="
          xcrun simctl list runtimes

          # Match the rejection's named device ("iPad Air 11-inch (M3)") by
          # substring rather than the exact string, since Apple's device-type
          # identifiers do not always match the marketing name verbatim.
          # jq rather than an embedded multi-line python3 script, which is
          # awkward to indent correctly inside a YAML block scalar.
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | jq -r \
            '.devicetypes[] | select(.name | ascii_downcase | contains("ipad air 11")) | .identifier' | head -n1)
          if [ -z "$DEVICE_TYPE" ]; then
            echo "::warning::No 'iPad Air 11-inch' simulator device type found; falling back to any iPad Air."
            DEVICE_TYPE=$(xcrun simctl list devicetypes -j | jq -r \
              '.devicetypes[] | select(.name | ascii_downcase | contains("ipad air")) | .identifier' | head -n1)
          fi
          test -n "$DEVICE_TYPE" || { echo "::error::No iPad Air simulator device type available on this runner."; exit 1; }
          echo "Using device type: $DEVICE_TYPE"

          RUNTIME=$(xcrun simctl list runtimes -j | jq -r \
            '[.runtimes[] | select(.isAvailable and (.name | contains("iPadOS")))] | sort_by(.version) | last | .identifier // empty')
          if [ -z "$RUNTIME" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | jq -r \
              '[.runtimes[] | select(.isAvailable and (.name | contains("iOS")))] | sort_by(.version) | last | .identifier // empty')
          fi
          test -n "$RUNTIME" || { echo "::error::No usable simulator runtime found."; exit 1; }
          echo "Using runtime: $RUNTIME"

          DEVICE_ID=$(xcrun simctl create ReviewIPad "$DEVICE_TYPE" "$RUNTIME")
          echo "Created device: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

          APP_PATH=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name "GoldRush.app" -path "*iphonesimulator*" | head -1)
          test -n "$APP_PATH" || { echo "::error::Could not find built GoldRush.app for the simulator."; find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2; exit 1; }
          echo "App: $APP_PATH"

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.goldrush.ci
          # The launch animation and the ad slot both settle late; a short
          # wait screenshots a half-drawn screen and wastes the round trip.
          sleep 8
          mkdir -p "$RUNNER_TEMP/screenshots"
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/screenshots/home-screen.png"
          xcrun simctl shutdown "$DEVICE_ID" || true

          # The first version of this fix passed CI and was rejected anyway:
          # the home screen scrolled, but App Review looks at the screen
          # rather than scrolling it, so the buttons below the fold still
          # read as "cut off". The screenshot alone did not make that
          # obvious, so print the geometry the layout actually has to fit
          # inside, and how much of the frame the app window occupies.
          echo "=== screenshot geometry ==="
          python3 - "$RUNNER_TEMP/screenshots/home-screen.png" <<'PY'
          import struct, sys
          path = sys.argv[1]
          with open(path, 'rb') as fh:
              head = fh.read(32)
          # PNG: 8-byte signature, then the IHDR chunk carries width/height.
          w, h = struct.unpack('>II', head[16:24])
          print(f"screenshot pixels: {w} x {h}")
          # The compatibility window is rendered at 2x, so points are half.
          print(f"approx points at 2x: {w // 2} x {h // 2}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-compat-screenshot
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
