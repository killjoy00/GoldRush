name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine + Sim (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
      - name: Release build (the simulator runs at -O)
        run: swift build -c release

  ios:
    name: iOS UI typecheck
    # Pinned from the probe run: macos-26 carries Xcode 26.6 (17F113), the
    # iOS 26.5 SDK and Swift 6.3.3 -- the same compiler the engine is tested
    # with on Linux, so there is no version skew between the two halves.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version
      - name: Build engine for iOS
        run: |
          xcodebuild build \
            -scheme GoldRushEngine \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO | tail -30
      - name: Typecheck the SwiftUI screens against the iOS SDK
        run: |
          xcodebuild build \
            -scheme GoldRushUI \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO | tail -40
