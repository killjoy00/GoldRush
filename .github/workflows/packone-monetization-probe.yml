name: Pack One monetization readiness probe
on:
  push:
    branches: ["chatgpt/packone-play-probe"]
    paths: [".github/workflows/packone-monetization-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Probe
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/pro.packone.app/subscriptions"
          code="$(curl -sS -o "$RUNNER_TEMP/subs.json" -w '%{http_code}' -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Accept: application/json" "$url")"
          echo "subscriptions_http=${code}"
          if [ "$code" = "200" ]; then
            echo "subscription_count=$(jq -r '(.subscriptions // []) | length' "$RUNNER_TEMP/subs.json")"
          else
            jq -r '"error_status=" + (.error.status // "unknown"), "error_message=" + (.error.message // "unknown")' "$RUNNER_TEMP/subs.json" 2>/dev/null || true
          fi
